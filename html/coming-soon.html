<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - BootUI Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<body class="page-coming-soon">
<div class="container">
    <div class="text-center mw-680">
        <!-- Logo -->
        <div class="mb-5">
            <div class="logo-icon mb-3">B</div>
            <div class="fw-bold fs-5 opacity-90">BootUI</div>
        </div>

        <!-- Heading -->
        <h1 class="display-3 fw-800 mb-3">Coming Soon</h1>
        <p class="fs-5 mb-5 opacity-80 mw-500">We're working hard to bring you something amazing. Stay tuned for the big launch!</p>

        <!-- Countdown Timer -->
        <div class="d-flex justify-content-center flex-wrap mb-5" id="countdown">
            <div class="countdown-box">
                <div class="number" id="days">42</div>
                <div class="label">Days</div>
            </div>
            <div class="countdown-box">
                <div class="number" id="hours">08</div>
                <div class="label">Hours</div>
            </div>
            <div class="countdown-box">
                <div class="number" id="minutes">34</div>
                <div class="label">Minutes</div>
            </div>
            <div class="countdown-box">
                <div class="number" id="seconds">56</div>
                <div class="label">Seconds</div>
            </div>
        </div>

        <!-- Newsletter Signup -->
        <div class="row g-2 justify-content-center mb-4 mw-500">
            <div class="col">
                <input type="email" class="form-control notify-input" placeholder="Enter your email address">
            </div>
            <div class="col-auto">
                <button class="btn btn-notify">Notify Me</button>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-wrapper mb-5">
            <div class="d-flex justify-content-between mb-2">
                <span class="small opacity-70">Progress</span>
                <span class="small fw-semibold">75%</span>
            </div>
            <div class="progress">
                <div class="progress-bar" style="width:75%"></div>
            </div>
        </div>

            <a href="#" class="social-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg></a>

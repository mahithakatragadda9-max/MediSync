<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lock Screen - BootUI Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    </head>
<body class="page-lockscreen">
    <div class="lock-card">
        <div class="lock-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        </div>
        <div class="avatar-circle">DD</div>
        <h3 class="user-name">David Dev</h3>
        <p class="user-email">david@bootui.com</p>
        <form>
            <div class="mb-4">
                <input type="password" class="form-control text-center" placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-4">Unlock</button>
        </form>
        <a href="auth-login.html" class="switch-link">Not David? <span class="fw-semibold text-indigo">Sign in with different account</span></a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

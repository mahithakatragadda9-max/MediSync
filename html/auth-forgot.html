<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - BootUI Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    </head>
<body class="page-auth">
    <div class="auth-wrapper">
        <div class="auth-brand">
            <div class="logo">
                <div class="logo-box">B</div>
                BootUI
            </div>
            <h3 class="fw-bold mb-3">Forgot Password?</h3>
            <p>No worries, we'll send you reset instructions</p>
            <svg width="200" height="160" viewBox="0 0 200 160" fill="none" class="mt-4" class="auth-svg-opacity">
                <rect x="40" y="40" width="120" height="80" rx="8" stroke="white" stroke-width="2"/>
                <path d="M40 48l60 40 60-40" stroke="white" stroke-width="2"/>
            </svg>
        </div>
        <div class="auth-form-side">
            <div class="auth-form">
                <a href="auth-login.html" class="back-link mb-4 d-inline-flex">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                    Back to Sign In
                </a>
                <h2 class="mt-3">Reset Password</h2>
                <p class="subtitle">Enter your email and we'll send a reset link</p>
                <form>
                    <div class="mb-4">
                        <label class="form-label fw-medium" for="email">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

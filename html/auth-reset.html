<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - BootUI Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    </head>
<body class="page-auth">
    <div class="auth-wrapper">
        <div class="auth-brand">
            <div class="logo">
                <div class="logo-box">B</div>
                BootUI
            </div>
            <h3 class="fw-bold mb-3">Set New Password</h3>
            <p>Create a strong password to secure your account</p>
            <svg width="200" height="160" viewBox="0 0 200 160" fill="none" class="mt-4" class="auth-svg-opacity">
                <rect x="60" y="50" width="80" height="70" rx="8" stroke="white" stroke-width="2"/>
                <circle cx="100" cy="80" r="12" stroke="white" stroke-width="2"/>
                <path d="M100 84v10" stroke="white" stroke-width="2" stroke-linecap="round"/>
                <path d="M75 50V38a25 25 0 0150 0v12" stroke="white" stroke-width="2"/>
            </svg>
        </div>
        <div class="auth-form-side">
            <div class="auth-form">
                <a href="auth-login.html" class="back-link mb-4 d-inline-flex">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                    Back to Sign In
                </a>
                <h2 class="mt-3">Set New Password</h2>
                <p class="subtitle">Your new password must be different from previous</p>
                <form>
                    <div class="mb-3">
                        <label class="form-label fw-medium" for="new-password">New Password</label>
                        <input type="password" class="form-control" id="new-password" placeholder="Enter new password">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium" for="confirm-password">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm-password" placeholder="Confirm new password">
                    </div>
                    <ul class="password-req">
                        <li>
                            <span class="check-icon">
                                <svg width="8" height="8" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </span>
                            At least 8 characters
                        </li>
                        <li>
                            <span class="check-icon">
                                <svg width="8" height="8" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </span>
                            One uppercase letter
                        </li>
                        <li>
                            <span class="check-icon">
                                <svg width="8" height="8" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </span>
                            One number
                        </li>
                        <li>
                            <span class="check-icon">
                                <svg width="8" height="8" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </span>
                            One special character
                        </li>
                    </ul>
                    <button type="submit" class="btn btn-primary w-100">Reset Password</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

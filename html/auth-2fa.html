<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Authentication - BootUI Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    </head>
<body class="page-auth">
    <div class="auth-wrapper">
        <div class="auth-brand">
            <div class="logo">
                <div class="logo-box">B</div>
                BootUI
            </div>
            <h3 class="fw-bold mb-3">Security First</h3>
            <p>Your account is protected with two-factor authentication</p>
            <svg width="160" height="160" viewBox="0 0 160 160" fill="none" class="mt-4" class="auth-svg-opacity">
                <path d="M80 20l50 20v40c0 30-20 55-50 65-30-10-50-35-50-65V40l50-20z" stroke="white" stroke-width="2"/>
                <path d="M60 80l15 15 25-25" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div class="auth-form-side">
            <div class="auth-form">
                <div class="shield-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </div>
                <h2>Two-Factor Authentication</h2>
                <p class="subtitle">Enter the 6-digit code from your authenticator app</p>
                <form>
                    <div class="otp-inputs">
                        <input type="text" maxlength="1" id="otp1" autofocus>
                        <input type="text" maxlength="1" id="otp2">
                        <input type="text" maxlength="1" id="otp3">
                        <input type="text" maxlength="1" id="otp4">
                        <input type="text" maxlength="1" id="otp5">
                        <input type="text" maxlength="1" id="otp6">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-4">Verify</button>
                </form>
                <div class="text-center">
                    <p class="text-muted mb-2" class="fs-12">
                        Didn't receive code? <a href="#" class="text-decoration-none fw-semibold">Resend</a>
                    </p>
                    <a href="#" class="text-decoration-none" class="auth-muted-link">Use backup code instead</a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
